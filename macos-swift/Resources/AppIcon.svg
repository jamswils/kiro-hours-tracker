<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kiro Sessions Inspector app icon.
  1024×1024 canvas, Big Sur style: rounded-rect background with the Kiro Z mark
  centered at ~62% of the canvas.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
    <defs>
        <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1024"
            gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#9b4dff" />
            <stop offset="0.6" stop-color="#7e14ff" />
            <stop offset="1" stop-color="#4a00b8" />
        </linearGradient>

        <linearGradient id="zGradient" x1="208" y1="196" x2="816" y2="828"
            gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="1" stop-color="#ede6ff" />
        </linearGradient>

        <filter id="zShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
            <feOffset dx="0" dy="18" result="offsetBlur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.35" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Big Sur style squircle background. Corner radius ~22.5% of the canvas. -->
    <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bgGradient)" />

    <!--
    Kiro lightning-Z mark, scaled from the 48×46 original to fit a 640×614
    box centered on the canvas (~62% width with ~20% top/bottom padding).
    Transform: translate to (192, 205), scale by (640/48) ≈ 13.333.
  -->
    <g transform="translate(192 205) scale(13.333)" filter="url(#zShadow)">
        <path fill="url(#zGradient)"
            d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" />
    </g>
</svg>