name: Release macOS app

# Tag a release with `git tag v0.1.0 && git push --tags` and this workflow
# will build an ad-hoc-signed .dmg and .zip and attach them to a GitHub
# Release, producing a download link users can share.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 0.1.0). Defaults to CFBundleShortVersionString."
        required: false

permissions:
  contents: write

jobs:
  build:
    # macos-14 is arm64. Pin to keep ABI predictable.
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos-swift
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build artifacts
        run: |
          ./scripts/make-dmg.sh "${{ steps.version.outputs.version }}"
          ./scripts/make-zip.sh "${{ steps.version.outputs.version }}"

      - name: Compute checksums
        run: |
          cd .build/dist
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: kiro-sessions-inspector-${{ steps.version.outputs.version }}
          path: macos-swift/.build/dist/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos-swift/.build/dist/*.dmg
            macos-swift/.build/dist/*.zip
            macos-swift/.build/dist/SHA256SUMS.txt
          body: |
            macOS arm64 build of Kiro Sessions Inspector.

            The app is ad-hoc signed, not notarized. On first launch you may need to
            right-click → Open, or run:
              xattr -dr com.apple.quarantine /Applications/KiroSessionsInspector.app
            See DISTRIBUTION.md in the repo for details.
